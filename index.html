<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учитель математики</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.fontsource.org/fonts/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <!-- Hero Section -->
    <header class="relative h-[420px] overflow-hidden">
        <img src="https://image.qwenlm.ai/public_source/598769f1-d7cb-4503-876c-4a5dfc6d4198/1ccdecf59-b49c-4658-b58b-f441e23216fc.png" alt="Математический фон" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-white/80 via-white/60 to-slate-50"></div>
        <div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-4 max-w-4xl mx-auto">
            <span class="inline-block px-4 py-1.5 rounded-full bg-blue-100 text-blue-700 text-sm font-medium mb-4 fade-in" style="animation-delay: 0.1s;">Математика · Образование</span>
            <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 mb-4 tracking-tight fade-in" style="animation-delay: 0.2s;">Учитель математики</h1>
            <p class="text-lg md:text-xl text-slate-600 max-w-2xl fade-in" style="animation-delay: 0.3s;">Выберите свой класс, чтобы перейти к учебным материалам, домашним заданиям и полезным ресурсам.</p>
        </div>
    </header>

    <!-- Grades Grid -->
    <main class="max-w-6xl mx-auto py-16 px-4 md:px-8">
        <div class="flex items-center justify-between mb-10 fade-in" style="animation-delay: 0.4s;">
            <h2 class="text-2xl font-bold text-slate-800">Выберите класс</h2>
            <div class="h-px flex-1 bg-slate-200 ml-6"></div>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="grades-grid">
            <!-- Cards will be injected by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-300 py-10 mt-16">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm">© 2026 Кабинет математики. Все права защищены.</p>
        </div>
    </footer>

    <script>
        const grades = [
            { number: 6, title: '6 класс', desc: 'Дроби, пропорции, рациональные числа', color: 'from-blue-500 to-cyan-500' },
            { number: 7, title: '7 класс', desc: 'Алгебра, линейные уравнения, функции', color: 'from-indigo-500 to-purple-500' },
            { number: 8, title: '8 класс', desc: 'Квадратные уравнения, геометрия', color: 'from-purple-500 to-pink-500' },
            { number: 9, title: '9 класс', desc: 'Подготовка к ОГЭ, неравенства', color: 'from-pink-500 to-rose-500' },
            { number: 10, title: '10 класс', desc: 'Тригонометрия, производные', color: 'from-orange-500 to-red-500' },
            { number: 11, title: '11 класс', desc: 'Подготовка к ЕГЭ, интегралы', color: 'from-emerald-500 to-teal-500' }
        ];

        const grid = document.getElementById('grades-grid');

        grades.forEach((g, index) => {
            const card = document.createElement('a');
            card.href = `class${g.number}.html`;
            card.className = `card-hover fade-in text-left bg-white rounded-2xl p-6 border border-slate-100 group block`;
            card.style.animationDelay = `${0.5 + index * 0.1}s`;
            card.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${g.color} flex items-center justify-center text-white text-2xl font-bold shadow-lg group-hover:scale-110 transition-transform duration-300">
                        ${g.number}
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-blue-600 group-hover:translate-x-1 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-2">${g.title}</h3>
                <p class="text-slate-500 text-sm leading-relaxed">${g.desc}</p>
                <div class="mt-4 pt-4 border-t border-slate-100 flex items-center text-xs text-slate-400 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                    Открыть материалы
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
