<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Пиратский квест: Остров Дробей</title>
<link href="https://cdn.jsdelivr.net/npm/fontsource-roboto@5.0.0/index.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #f5e6d3;
    overflow-x: hidden;
  }
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .container {
    max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1;
  }
  .header {
    text-align: center; padding: 30px 20px;
    background: linear-gradient(135deg, rgba(139,69,19,0.3), rgba(210,105,30,0.2));
    border: 2px solid #8b4513; border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(210,105,30,0.3);
  }
  .header h1 {
    font-size: 2.2em; color: #ffd700;
    text-shadow: 2px 2px 4px #000, 0 0 20px rgba(255,215,0,0.5);
    margin-bottom: 10px;
  }
  .header p { font-size: 1.1em; color: #f5e6d3; }
  .progress-container {
    background: rgba(0,0,0,0.4); border-radius: 20px; padding: 5px;
    margin: 20px 0; border: 1px solid #8b4513;
  }
  .progress-bar {
    height: 25px; background: linear-gradient(90deg, #8b4513, #d2691e, #ffd700);
    border-radius: 15px; width: 0%; transition: width 0.8s ease;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #1a1a2e; font-size: 0.9em;
  }
  .quest-map {
    display: flex; justify-content: space-between; margin: 20px 0;
    flex-wrap: wrap; gap: 10px;
  }
  .map-point {
    flex: 1; min-width: 120px; text-align: center; padding: 15px 10px;
    background: rgba(139,69,19,0.2); border: 2px solid #8b4513;
    border-radius: 10px; cursor: pointer; transition: all 0.3s;
    position: relative;
  }
  .map-point:hover { transform: translateY(-3px); background: rgba(139,69,19,0.4); }
  .map-point.active { border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
  .map-point.completed { background: rgba(34,139,34,0.3); border-color: #228b22; }
  .map-point.locked { opacity: 0.5; cursor: not-allowed; }
  .map-point .icon { font-size: 2em; margin-bottom: 5px; }
  .map-point .label { font-size: 0.85em; }
  .task-card {
    background: linear-gradient(135deg, rgba(44,24,16,0.9), rgba(75,40,20,0.8));
    border: 3px solid #8b4513; border-radius: 15px;
    padding: 30px; margin: 20px 0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: slideIn 0.5s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-card h2 {
    color: #ffd700; font-size: 1.5em; margin-bottom: 15px;
    display: flex; align-items: center; gap: 10px;
  }
  .task-description {
    background: rgba(245,230,211,0.1); padding: 15px;
    border-left: 4px solid #d2691e; border-radius: 5px;
    margin-bottom: 20px; font-size: 1.05em; line-height: 1.6;
  }
  .expression {
    font-size: 1.3em; text-align: center; padding: 15px;
    background: rgba(0,0,0,0.3); border-radius: 10px;
    margin: 15px 0; font-family: 'Times New Roman', serif;
  }
  .answer-input {
    width: 100%; padding: 15px; font-size: 1.1em;
    background: rgba(245,230,211,0.1); border: 2px solid #8b4513;
    border-radius: 10px; color: #f5e6d3; margin: 10px 0;
    transition: border-color 0.3s;
  }
  .answer-input:focus { outline: none; border-color: #ffd700; }
  .btn {
    padding: 12px 30px; font-size: 1.1em; border: none;
    border-radius: 10px; cursor: pointer; font-weight: bold;
    transition: all 0.3s; margin: 5px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #d2691e, #8b4513);
    color: #ffd700; border: 2px solid #ffd700;
  }
  .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.5); }
  .btn-hint {
    background: rgba(139,69,19,0.3); color: #f5e6d3;
    border: 2px solid #8b4513;
  }
  .btn-hint:hover { background: rgba(139,69,19,0.5); }
  .feedback {
    padding: 15px; border-radius: 10px; margin: 15px 0;
    font-weight: bold; display: none;
  }
  .feedback.success {
    background: rgba(34,139,34,0.3); border: 2px solid #228b22;
    color: #90ee90; display: block;
  }
  .feedback.error {
    background: rgba(178,34,34,0.3); border: 2px solid #b22222;
    color: #ff6b6b; display: block;
  }
  .hint-box {
    background: rgba(255,215,0,0.1); border: 2px dashed #ffd700;
    padding: 15px; border-radius: 10px; margin: 15px 0;
    display: none; font-style: italic;
  }
  .options {
    display: grid; gap: 10px; margin: 15px 0;
  }
  .option {
    padding: 15px; background: rgba(245,230,211,0.1);
    border: 2px solid #8b4513; border-radius: 10px;
    cursor: pointer; transition: all 0.3s;
  }
  .option:hover { background: rgba(139,69,19,0.4); transform: translateX(5px); }
  .option.selected { border-color: #ffd700; background: rgba(255,215,0,0.2); }
  .option.correct { border-color: #228b22; background: rgba(34,139,34,0.3); }
  .option.wrong { border-color: #b22222; background: rgba(178,34,34,0.3); }
  .final-screen {
    text-align: center; padding: 40px;
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(210,105,30,0.2));
    border: 3px solid #ffd700; border-radius: 20px;
    animation: glow 2s infinite alternate;
  }
  sup{
    position: relative;
    left: 0.6rem;
    top:-0.6rem;
  }
  @keyframes glow {
    from { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    to { box-shadow: 0 0 40px rgba(255,215,0,0.6); }
  }
  .final-screen h2 { font-size: 2.5em; color: #ffd700; margin-bottom: 20px; }
  .treasure { font-size: 4em; animation: bounce 1s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .score-display {
    font-size: 1.5em; color: #ffd700; margin: 20px 0;
  }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .header h1 { font-size: 1.5em; }
    .task-card { padding: 20px; }
    .map-point { min-width: 80px; padding: 10px 5px; }
  }
  .inline-input {
    display: inline-block;
    width: 150px;
    margin: 0 5px;
  }
  .subtask-block {
    background: rgba(0,0,0,0.2);
    padding: 10px;
    border-radius: 10px;
    margin: 10px 0;
  }
  .subtask-block .expression {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .subtask-block .answer-input {
    width: 180px;
    display: inline-block;
  }
  /*для уравнения*/
  /* ===== Контейнер уравнения ===== */
.equation-display {
    font-family: 'Times New Roman', 'Georgia', serif;
    font-size: 2em;
    color: #f5e6d3;
    background: rgba(44, 24, 16, 0.9);
    padding: 30px 40px;
    border: 3px solid #8b4513;
    border-radius: 15px;
    display: inline-block;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    text-align: center;
    line-height: 2;
}

/* ===== Дробь с горизонтальной чертой ===== */
.fraction-horizontal {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    margin: 0 5px;
    font-size: 0.7em;;
    line-height: 1.2;
}

.fraction-horizontal .numerator {
    display: block;
    padding: 0 12px 4px 12px;
    color: #f7f6f5;
}

.fraction-horizontal .fraction-line {
    display: block;
    height: 3px;
    background: #f7f7f5;
    margin: 0 auto;
    width: 100%;
    min-width: 35px;
    border-radius: 2px;
}

.fraction-horizontal .denominator {
    display: block;
    padding: 4px 12px 0 12px;
}

/* ===== Маленькая дробь для смешанного числа ===== */
.fraction-horizontal.small {
    font-size: 0.7em;
}

.fraction-horizontal.small .fraction-line {
    height: 2px;
    min-width: 20px;
     font-size: 0.7em;
}

/* ===== Смешанное число ===== */
.mixed-number {
    display: inline-block;
    vertical-align: middle;
     font-size: 0.7em;
}

.mixed-number .whole {
    font-size: 0.7em;
    margin-right: 2px;
}

/* ===== Операторы и скобки ===== */
.bracket {
    color: #f5e6d3;
     font-size: 0.7em;
   
}

.operator {
    color: #f5e6d3;
    margin: 0 4px;
     font-size: 0.7em;
}

.equals {
    color: #f4f3f1;
    margin: 0 10px;
     font-size: 0.7em;
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="header">
    <h1>🏴‍☠️ Пиратский квест: Остров Дробей ⚓</h1>
    <p>Реши все задания и найди сокровища капитана Чёрная Борода!</p>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar">0%</div>
  </div>

  <div class="quest-map" id="questMap"></div>

  <div id="gameArea"></div>
</div>

<script>
const tasks = [
  {
    id: 1,
    icon: "⚓",
    title: "Задание 1:  На какой карте компас врёт?",
    description: "Капитан кричит: «Лево руля!» или «Право руля!». Найди <b>неправилую</b>карту, где команды (порядок действий) перепутаны.",
    type: "choice",
   options: [
      { text: "а) 0,14<sup>1</sup> · 2,2<sup>3</sup> + 7,2<sup>2</sup> : 0,03", value: "a" },
      { text: "б) 0,31<sup>3</sup> + (18<sup>2</sup> − 9,4)<sup>1</sup> · 0,4", value: "b" }
    ],
    correct: "b",
    hint: "В выражении со скобками сначала выполняется действие в скобках, затем умножение, потом сложение. Проверь, какой порядок указан в варианте б.",
    explanation: "В варианте б) неправильно: сначала должно быть вычитание в скобках (1), потом умножение на 0,4 (2), затем сложение (3). А в задании порядок перепутан."
  },
  {
    id: 2,
    icon: "💀",
    title: "Задание 2: Битва с Кракеном",
    description: "Чтобы уплыть от чудовища, нужно перевести дроби в пушечные ядра. Раздели числитель на знаменатель и представь обыкновенную дробь в виде десятичной:",
    type: "multi",
    subtasks: [
      { expr: "5/8 =", correct: "0.625", hint: "Раздели 5 на 8 в столбик" },
      { expr: "2/3 =", correct: "0,(6)", altCorrect: ["0.666...", "0.666", "0,666...", "0,(6)", "0.6(6)"], hint: "Это бесконечная периодическая дробь. Запиши как 0,(6)" }
    ]
  },
  {
    id: 3,
    icon: "🧭",
    title: "Задание 3: Старая карта",
    description: "Ты нашел свиток с выражением. Разгадав его ты узнаешь сколько золотых монет в сундуке? ",
    expression: "(23 − 18,7) · 6,6 + 6 : 0,15",
    type: "input",
    correct: "68.38",
    altCorrect: ["68,38"],
    hint: "1) 23−18,7=4,3; 2) 4,3·6,6=28,38; 3) 6·0,15=0,9; 4) 28,38+0,9=?"
  },
  {
    id: 4,
    icon: "⚖️",
    title: "Задание 4: Заклинание для двери",
    description: "Дверь пещеры заперта уравнением. Чтобы снять чары, приведи все дроби к десятичному виду (одному виду!).",
    expression: '<div class="equation-display"><span class="bracket">(</span><span class="fraction-horizontal"><span class="numerator">17</span><span class="fraction-line"></span><span class="denominator">20</span></span><span class="operator">· x − 1,72</span><span class="bracket">)</span><span class="operator">:</span><span class="operator">1,3</span><span class="operator equals">=</span><span class="mixed-number"><span class="whole">2</span><span class="fraction-horizontal small"><span class="numerator">3</span><span class="fraction-line"></span><span class="denominator">5</span></span></span></div>',
    type: "input",
    correct: "6",
    altCorrect: ["6"],
    hint: ""
  },
  {
    id: 5,
    icon: "🍎",
    title: "Задание 5: Дележка добычи",
    description: "В трюме лежали яблоки (трофеи). Сначала пираты съели 0,5 всех яблок, затем 0,5 остатка. После этого осталось всего 9 яблок. Сколько яблок было сначала?",
    type: "input",
    correct: "36",
    altCorrect: ["36,0", "36.0"],
    hint: "Пусть было x яблок. После первого раза осталось 0,5x. После второго: 0,5 · 0,5x = 0,25x = 9. Найди x."
  }
];

let currentTask = 0;
let completed = [];
let selectedChoice = null;

function init() {
  createStars();
  renderMap();
  showTask(0);
}

function createStars() {
  const stars = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
    star.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(star);
  }
}

function renderMap() {
  const map = document.getElementById('questMap');
  map.innerHTML = '';
  tasks.forEach((task, idx) => {
    const point = document.createElement('div');
    point.className = 'map-point';
    if (completed.includes(idx)) point.classList.add('completed');
    else if (idx === currentTask) point.classList.add('active');
    else if (idx > currentTask) point.classList.add('locked');
    
    point.innerHTML = `
      <div class="icon">${task.icon}</div>
      <div class="label">${completed.includes(idx) ? '✓ ' : ''}Этап ${idx + 1}</div>
    `;
    if (idx <= currentTask) {
      point.onclick = () => showTask(idx);
    }
    map.appendChild(point);
  });
}

function updateProgress() {
  const pct = Math.round((completed.length / tasks.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressBar').textContent = pct + '%';
}

function showTask(idx) {
  if (idx > currentTask && !completed.includes(currentTask)) return;
  
  currentTask = idx;
  renderMap();
  selectedChoice = null;
  
  const task = tasks[idx];
  const area = document.getElementById('gameArea');
  
  if (completed.includes(idx)) {
    area.innerHTML = `
      <div class="task-card">
        <h2>${task.icon} ${task.title} ✓</h2>
        <div class="feedback success">✅ Задание выполнено! Правильный ответ сохранён.</div>
        <button class="btn btn-primary" onclick="goNext()">Продолжить →</button>
      </div>
    `;
    return;
  }

  let html = `<div class="task-card"><h2>${task.icon} ${task.title}</h2>`;
  html += `<div class="task-description">${task.description}</div>`;

  if (task.type === 'choice') {
    html += `<div class="options" id="options">`;
    task.options.forEach((opt, i) => {
      html += `<div class="option" onclick="selectOption(${i}, '${opt.value}')">${opt.text}</div>`;
    });
    html += `</div>`;
    html += `<div id="selectedAnswer" style="margin:10px 0;color:#ffd700;"></div>`;
    html += `<button class="btn btn-primary" onclick="checkChoice()">Проверить ⚔️</button>`;
  } else if (task.type === 'multi') {
    task.subtasks.forEach((sub, i) => {
      html += `<div class="subtask-block">`;
      html += `<div class="expression">${sub.expr} <input type="text" class="answer-input" id="ans_${i}" placeholder="Твой ответ"></div>`;
      html += `</div>`;
    });
    html += `<button class="btn btn-primary" onclick="checkMulti()">Проверить ⚔️</button>`;
  } else if (task.type === 'input') {
    if (task.expression) html += `<div class="expression">${task.expression}</div>`;
    html += `<input type="text" class="answer-input" id="answer" placeholder="Введи ответ...">`;
    html += `<button class="btn btn-primary" onclick="checkInput()">Проверить ⚔️</button>`;
  }

  html += `<button class="btn btn-hint" onclick="showHint()">💡 Подсказка</button>`;
  html += `<div class="hint-box" id="hintBox">${task.hint}</div>`;
  html += `<div class="feedback" id="feedback"></div>`;
  html += `</div>`;
  
  area.innerHTML = html;
}

function goNext() {
  if (currentTask < tasks.length - 1) {
    showTask(currentTask + 1);
  } else {
    showFinal();
  }
}

function selectOption(idx, value) {
  selectedChoice = value;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('selectedAnswer').textContent = `Выбрано: ${value.toUpperCase()}`;
}

function checkChoice() {
  const task = tasks[currentTask];
  const fb = document.getElementById('feedback');
  if (!selectedChoice) {
    fb.className = 'feedback error';
    fb.textContent = '⚠️ Выбери один из вариантов!';
    return;
  }
  if (selectedChoice === task.correct) {
    fb.className = 'feedback success';
    fb.innerHTML = `✅ Верно! ${task.explanation}`;
    completeTask();
    document.querySelectorAll('.option').forEach((el, i) => {
      if (task.options[i].value === task.correct) el.classList.add('correct');
    });
  } else {
    fb.className = 'feedback error';
    fb.textContent = '❌ Неправильно! Подумай ещё раз или используй подсказку.';
    document.querySelectorAll('.option').forEach((el, i) => {
      if (task.options[i].value === selectedChoice) el.classList.add('wrong');
    });
  }
}

function checkMulti() {
  const task = tasks[currentTask];
  const fb = document.getElementById('feedback');
  let allCorrect = true;
  let wrongIndexes = [];
  task.subtasks.forEach((sub, i) => {
    const val = document.getElementById(`ans_${i}`).value.trim().replace(',', '.');
    const correct = sub.correct.replace(',', '.');
    const altCorrect = (sub.altCorrect || []).map(a => a.replace(',', '.'));
    if (val !== correct && !altCorrect.includes(val)) {
      allCorrect = false;
      wrongIndexes.push(i + 1);
    }
  });
  if (allCorrect) {
    fb.className = 'feedback success';
    fb.textContent = '✅ Отлично! Все дроби переведены верно!';
    completeTask();
  } else {
    fb.className = 'feedback error';
    fb.textContent = `❌ Есть ошибки в задании ${wrongIndexes.join(', ')}. Проверь ответы.`;
  }
}

function checkInput() {
  const task = tasks[currentTask];
  const fb = document.getElementById('feedback');
  const val = document.getElementById('answer').value.trim().replace(',', '.');
  const correct = task.correct.replace(',', '.');
  const altCorrect = (task.altCorrect || []).map(a => a.replace(',', '.'));
  if (val === correct || altCorrect.includes(val)) {
    fb.className = 'feedback success';
    fb.textContent = '✅ Правильно! Сундук открыт!';
    completeTask();
  } else {
    fb.className = 'feedback error';
    fb.textContent = '❌ Неверно. Попробуй ещё раз!';
  }
}

function showHint() {
  const hintBox = document.getElementById('hintBox');
  if (hintBox) {
    hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
  }
}

function completeTask() {
  if (!completed.includes(currentTask)) {
    completed.push(currentTask);
  }
  updateProgress();
  renderMap();
  
  setTimeout(() => {
    const nextTask = currentTask + 1;
    if (nextTask < tasks.length) {
      showTask(nextTask);
    } else {
      showFinal();
    }
  }, 2500);
}

function showFinal() {
  const area = document.getElementById('gameArea');
  const allDone = completed.length === tasks.length;
  if (allDone) {
    area.innerHTML = `
      <div class="final-screen">
        <div class="treasure">🏆</div>
        <h2>Сокровища найдены!</h2>
        <p style="font-size:1.2em;margin:20px 0;">Поздравляем, юный пират! Ты решил все задания и нашёл клад капитана Чёрная Борода!</p>
        <div class="score-display">Пройдено: ${completed.length} из ${tasks.length} этапов</div>
        <button class="btn btn-primary" onclick="location.reload()">🔄 Начать заново</button>
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="task-card">
        <h2>🏴‍☠️ Продолжение пути</h2>
        <p>Ты прошёл ${completed.length} из ${tasks.length} этапов. Продолжай!</p>
        <button class="btn btn-primary" onclick="goNext()">Далее →</button>
      </div>
    `;
  }
}

init();
</script>
</body>
</html>
